productName: PatentHub
appId: patent.hub
asar: true
asarUnpack:
  - "**/*.{node,dll}"
  - "**/node_modules/libsql/**"
  - "**/node_modules/@napi-rs/canvas*/**"
  - "**/node_modules/pdf-parse/**"
  - "**/node_modules/pdfjs-dist/**"
  - "**/node_modules/officeparser/**"
  - "**/node_modules/cfb/**"
  - "**/node_modules/codepage/**"
  - "**/node_modules/adm-zip/**"
files:
  - "dist"
  - "node_modules"
  - "package.json"

afterPack: .erb/scripts/patch-libsql.cjs

mac:
  notarize: false
  category: public.app-category.developer-tools
  target:
    - target: default
  type: distribution
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  publisherName: 专利审查四川中心
  # === 代码签名（按需启用，详见 docs/code-signing.md）===
  # USB Token / 证书已装入 Windows 证书库时，二选一：
  # certificateSubjectName: "证书 Subject 中的 CN"
  # certificateSha1: "证书指纹（去空格，大写）"
  # .pfx 证书：优先在构建时用环境变量 CSC_LINK / CSC_KEY_PASSWORD，不要把密码写进仓库；
  # 如确需写在此处，取消下面两行注释：
  # certificateFile: C:\certs\patenthub.pfx
  # certificatePassword: "******"
  # 云 HSM（DigiCert KeyLocker / Sectigo / SSL.com / Azure Trusted Signing 等）：
  # sign: ./scripts/sign-windows.mjs
  # signingHashAlgorithms:
  #   - sha256
  # rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  include: assets/installer.nsh
  artifactName: ${productName}-${version}-Setup.${ext}
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  license: LICENSE

portable:
  artifactName: ${productName}-${version}-Portable.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}
  maintainer: patentcenter.sichuan@cnipa.gov.cn
  vendor: 专利审查四川中心

directories:
  app: release/app
  buildResources: assets
  output: release/build

extraResources:
  - from: resources/babeldoc
    to: resources/babeldoc
    filter:
      - "**/*"
  - from: resources/myocr
    to: resources/myocr
    filter:
      - "**/*"
      - "!.venv/**"
      - "!__pycache__/**"
      - "!*.pyc"
  - from: assets
    to: assets
    filter:
      - "**/*"
  - from: scripts/ppt2pptx.py
    to: scripts/ppt2pptx.py
  - from: src/main/ppt-parser.js
    to: parsers/ppt-parser.js

publish: null
